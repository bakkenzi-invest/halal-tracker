<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инвестиционный Портфель | Bakkenzi</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #2ecc71;
            --text-color: #ffffff;
            --text-secondary: #a0a0a0;
            --danger-color: #e74c3c;
            --warning-color: #f1c40f;
            --border-color: #333333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 950px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #ffd700;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .summary-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 26px;
            font-weight: bold;
        }

        .add-form {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)) 140px 110px;
            gap: 12px;
            align-items: center;
        }

        input, select {
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        button.btn-add {
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button.btn-add:hover {
            background: #27ae60;
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 15px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #252525;
            color: var(--text-secondary);
            font-size: 13px;
            text-transform: uppercase;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .badge-profit { color: var(--accent-color); font-weight: bold; }
        .badge-loss { color: var(--danger-color); font-weight: bold; }

        .halal-tag {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }
        .status-halal { background: rgba(46, 204, 113, 0.2); color: var(--accent-color); border: 1px solid var(--accent-color); }
        .status-review { background: rgba(241, 196, 15, 0.2); color: var(--warning-color); border: 1px solid var(--warning-color); }
        .status-doubtful { background: rgba(231, 76, 60, 0.2); color: var(--danger-color); border: 1px solid var(--danger-color); }

        .btn-delete {
            background: transparent;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 16px;
            opacity: 0.7;
        }

        .btn-delete:hover { opacity: 1; }

        .ticker-symbol {
            font-weight: bold;
            font-size: 16px;
        }

        .refresh-btn {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
        }

        .refresh-btn:hover { background: #444; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>💼 Портфель Инвестора</h1>
        <div class="subtitle">Отслеживание халяльных активов в реальном времени</div>
        <button class="refresh-btn" id="refreshBtn">🔄 Обновить котировки</button>
    </header>

    <div class="summary-card">
        <div class="stat-item">
            <div class="stat-label">Стоимость портфеля</div>
            <div class="stat-value" id="totalValue">$0.00</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">Инвестировано</div>
            <div class="stat-value" id="totalInvested">$0.00</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">Прибыль / Убыток</div>
            <div class="stat-value" id="totalPnl">$0.00 (0%)</div>
        </div>
    </div>

    <form class="add-form" id="stockForm">
        <input type="text" id="tickerInput" placeholder="Тикер (AAPL)" required style="text-transform:uppercase">
        <input type="number" id="sharesInput" placeholder="Кол-во (шт)" step="any" min="0.0001" required>
        <input type="number" id="priceInput" placeholder="Цена ($)" step="any" min="0.01" required>
        
        <select id="halalInput" required>
            <option value="Halal">✅ Halal (Проверено)</option>
            <option value="Review">🟡 Требует проверки</option>
            <option value="Doubtful">🔴 Сомнительно</option>
        </select>

        <button type="submit" class="btn-add">+ Добавить</button>
    </form>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Акция</th>
                    <th>Статус</th>
                    <th>Кол-во</th>
                    <th>Ср. цена</th>
                    <th>Текущая цена</th>
                    <th>Стоимость</th>
                    <th>P&L ($ / %)</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="portfolioTable">
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_KEY = 'd9rlnh9r01qoo7o4oge0d9rlnh9r01qoo7o4ogeg'; 

    let portfolio = JSON.parse(localStorage.getItem('userPortfolio')) || [];

    const stockForm = document.getElementById('stockForm');
    const tickerInput = document.getElementById('tickerInput');
    const sharesInput = document.getElementById('sharesInput');
    const priceInput = document.getElementById('priceInput');
    const halalInput = document.getElementById('halalInput');
    const portfolioTable = document.getElementById('portfolioTable');
    const refreshBtn = document.getElementById('refreshBtn');

    async function fetchCurrentPrice(symbol) {
        try {
            const response = await fetch(`https://finnhub.io/api/v1/quote?symbol=${symbol.toUpperCase()}&token=${API_KEY}`);
            const data = await response.json();
            return data.c && data.c > 0 ? data.c : null;
        } catch (error) {
            console.error('Ошибка получения цены:', error);
            return null;
        }
    }

    function savePortfolio() {
        localStorage.setItem('userPortfolio', JSON.stringify(portfolio));
    }

    stockForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const symbol = tickerInput.value.trim().toUpperCase();
        const shares = parseFloat(sharesInput.value);
        const buyPrice = parseFloat(priceInput.value);
        const halalStatus = halalInput.value;

        const currentPrice = await fetchCurrentPrice(symbol);
        
        if (!currentPrice) {
            alert(`Тикер "${symbol}" не найден на бирже.`);
            return;
        }

        const existingStock = portfolio.find(item => item.symbol === symbol);

        if (existingStock) {
            const totalShares = existingStock.shares + shares;
            const totalCost = (existingStock.shares * existingStock.buyPrice) + (shares * buyPrice);
            existingStock.buyPrice = totalCost / totalShares;
            existingStock.shares = totalShares;
            existingStock.currentPrice = currentPrice;
            existingStock.halalStatus = halalStatus;
        } else {
            portfolio.push({
                symbol,
                shares,
                buyPrice,
                currentPrice,
                halalStatus
            });
        }

        savePortfolio();
        stockForm.reset();
        await updatePortfolioUI();
    });

    function deleteStock(symbol) {
        if (confirm(`Удалить ${symbol} из портфеля?`)) {
            portfolio = portfolio.filter(item => item.symbol !== symbol);
            savePortfolio();
            updatePortfolioUI();
        }
    }

    async function updatePortfolioUI() {
        portfolioTable.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:20px;">Загрузка котировок...</td></tr>';

        let totalValue = 0;
        let totalInvested = 0;

        if (portfolio.length === 0) {
            portfolioTable.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#888; padding:30px;">Ваш портфель пуст. Добавьте первую акцию выше!</td></tr>';
            document.getElementById('totalValue').textContent = '$0.00';
            document.getElementById('totalInvested').textContent = '$0.00';
            document.getElementById('totalPnl').textContent = '$0.00 (0%)';
            document.getElementById('totalPnl').className = 'stat-value';
            return;
        }

        portfolioTable.innerHTML = '';

        for (let item of portfolio) {
            const livePrice = await fetchCurrentPrice(item.symbol);
            if (livePrice) {
                item.currentPrice = livePrice;
            }

            const invested = item.shares * item.buyPrice;
            const currentValue = item.shares * item.currentPrice;
            const pnlDollar = currentValue - invested;
            const pnlPercent = (pnlDollar / invested) * 100;

            totalInvested += invested;
            totalValue += currentValue;

            const pnlClass = pnlDollar >= 0 ? 'badge-profit' : 'badge-loss';
            const pnlSign = pnlDollar >= 0 ? '+' : '';

            let statusBadge = '';
            if (item.halalStatus === 'Halal') {
                statusBadge = '<span class="halal-tag status-halal">✅ Halal</span>';
            } else if (item.halalStatus === 'Review') {
                statusBadge = '<span class="halal-tag status-review">🟡 Проверка</span>';
            } else {
                statusBadge = '<span class="halal-tag status-doubtful">🔴 Сомнительно</span>';
            }

            const row = document.createElement('tr');
            row.innerHTML = `
                <td class="ticker-symbol">${item.symbol}</td>
                <td>${statusBadge}</td>
                <td>${item.shares}</td>
                <td>$${item.buyPrice.toFixed(2)}</td>
                <td>$${item.currentPrice.toFixed(2)}</td>
                <td>$${currentValue.toFixed(2)}</td>
                <td class="${pnlClass}">${pnlSign}$${pnlDollar.toFixed(2)} (${pnlSign}${pnlPercent.toFixed(2)}%)</td>
                <td><button class="btn-delete" onclick="deleteStock('${item.symbol}')">✕</button></td>
            `;
            portfolioTable.appendChild(row);
        }

        savePortfolio();

        const totalPnlDollar = totalValue - totalInvested;
        const totalPnlPercent = totalInvested > 0 ? (totalPnlDollar / totalInvested) * 100 : 0;
        const totalPnlSign = totalPnlDollar >= 0 ? '+' : '';

        document.getElementById('totalValue').textContent = `$${totalValue.toFixed(2)}`;
        document.getElementById('totalInvested').textContent = `$${totalInvested.toFixed(2)}`;
        
        const pnlElement = document.getElementById('totalPnl');
        pnlElement.textContent = `${totalPnlSign}$${totalPnlDollar.toFixed(2)} (${totalPnlSign}${totalPnlPercent.toFixed(2)}%)`;
        pnlElement.className = `stat-value ${totalPnlDollar >= 0 ? 'badge-profit' : 'badge-loss'}`;
    }

    refreshBtn.addEventListener('click', updatePortfolioUI);
    updatePortfolioUI();
</script>

</body>
</html>
