<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halal Portfolio Tracker</title>
    <!-- Подключаем библиотеку Chart.js для красивой диаграммы -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }
        h1 {
            text-align: center;
            color: #2e7d32;
            margin-bottom: 20px;
        }
        .chart-box {
            position: relative;
            width: 100%;
            max-width: 320px;
            margin: 0 auto 25px auto;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            font-size: 16px;
        }
        .symbol {
            font-weight: bold;
        }
        .tag {
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Halal Portfolio Tracker</h1>
    
    <!-- Контейнер для круговой диаграммы -->
    <div class="chart-box">
        <canvas id="portfolioChart"></canvas>
    </div>

    <!-- Список бумаг -->
    <ul>
        <li>
            <span class="symbol">AAPL</span>
            <span>Apple Inc.</span>
            <span class="tag">Halal</span>
        </li>
        <li>
            <span class="symbol">MSFT</span>
            <span>Microsoft Corp.</span>
            <span class="tag">Halal</span>
        </li>
        <li>
            <span class="symbol">NVDA</span>
            <span>NVIDIA Corp.</span>
            <span class="tag">Halal</span>
        </li>
    </ul>
</div>

<script>
    // Настройка диаграммы Chart.js
    const ctx = document.getElementById('portfolioChart').getContext('2d');
    new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['Apple (AAPL)', 'Microsoft (MSFT)', 'NVIDIA (NVDA)'],
            datasets: [{
                data: [40, 35, 25], // Проценты долей в портфеле
                backgroundColor: ['#2e7d32', '#4caf50', '#81c784']
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'bottom'
                }
            }
        }
    });
</script>

</body>
</html>
